plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.pocketworkstation.pckeyboard'
    compileSdk 36

    defaultConfig {
        applicationId 'org.pocketworkstation.pckeyboard'
        minSdk 21
        targetSdk 36
        versionCode 1042002
        versionName "v1.42.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Product flavors for blue-green deployment
    // Use 'javaOnly' flavor as safe fallback, 'kotlinMixed' for new Kotlin code
    flavorDimensions += "codebase"
    productFlavors {
        javaOnly {
            dimension "codebase"
            applicationIdSuffix ".java"
            versionNameSuffix "-java"
        }
        kotlinMixed {
            dimension "codebase"
            // Default - uses Kotlin source files
        }
    }

    sourceSets {
        // Main source set - common resources, assets, and manifest
        main {
            java.srcDirs = []  // Disable default Java in main
            kotlin.srcDirs = []  // Disable default Kotlin in main
        }
        // Java-only flavor uses only Java sources (safe fallback)
        javaOnly {
            java.srcDirs = ['src/main/java']
        }
        // Kotlin flavor uses Kotlin sources + remaining unconverted Java files
        kotlinMixed {
            kotlin.srcDirs = ['src/main/kotlin']
            java.srcDirs = ['src/kotlinMixed/java']  // LatinIME.java (not yet converted)
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Kotlin
    implementation 'androidx.core:core-ktx:1.15.0'

    // AndroidX dependencies
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'

    // Instrumented testing (AndroidX Test)
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
